name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Scan current files for secrets
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --no-banner --redact /repo

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=agent --cov-report=term-missing

      - name: Verify Docker image excludes environment credentials
        run: |
          test ! -e .env.production
          fixture_dir="$(mktemp -d .docker-env-check.XXXXXX)"
          trap 'rm -f .env.production; rm -rf "$fixture_dir"' EXIT
          printf 'test-only-secret\n' > .env.production
          printf 'test-only-secret\n' > "$fixture_dir/.env.staging"
          printf 'example-placeholder\n' > "$fixture_dir/.env.example"
          docker build --tag sre-atlas-agent:ci .
          docker run --rm sre-atlas-agent:ci python -c 'from pathlib import Path; root=Path("/app"); assert not list(root.rglob(".env.production")); assert not list(root.rglob(".env.staging")); assert (root / ".env.example").is_file(); assert any(p.name == ".env.example" and p.parent.name.startswith(".docker-env-check.") for p in root.rglob(".env.example"))'
